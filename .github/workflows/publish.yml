name: publish

# Publishes the extension to the VS Code Marketplace and Open VSX when a GitHub
# Release is published.
#
# UNLIKE the org's other packages, the VS Code Marketplace has NO OIDC / trusted
# publishing path. Publishing requires an Azure DevOps Personal Access Token
# (Marketplace -> Manage scope) for vsce, and an Open VSX access token for ovsx.
# Both are stored as repository secrets:
#   VSCE_PAT  — Azure DevOps PAT, publisher `livetennisapi`
#   OVSX_PAT  — open-vsx.org token,  namespace `livetennisapi`
#
# One-time setup:
#   1. Create/confirm the publisher `livetennisapi` at
#      https://marketplace.visualstudio.com/manage
#   2. Generate an Azure DevOps PAT scoped Marketplace -> Manage, all orgs.
#   3. Claim the Open VSX namespace once: `npx ovsx create-namespace livetennisapi`
#   4. Add VSCE_PAT and OVSX_PAT as Actions secrets on this repo.
#
# The SAME .vsix is published to both registries — built once, published twice.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run typecheck

      - name: Assert the tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag ($TAG) does not match package.json ($PKG)"
            exit 1
          fi
          echo "tag and version agree: $PKG"

      - name: Package the .vsix
        run: npx @vscode/vsce package -o extension.vsix

      - name: Publish to the VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath extension.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish extension.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
