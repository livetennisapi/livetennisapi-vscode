version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/vscode must not exceed engines.vscode: `vsce package` refuses the
      # manifest otherwise. Raise engines.vscode and @types/vscode together by hand.
      - dependency-name: "@types/vscode"
